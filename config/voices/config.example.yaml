default_voice_key: victor

voices:
  victor:
    display_name: "Victor"
    volume_db: 0.0                            # Premiere narration gain, -96 to +15 dB; default 0
    elevenlabs_voice_id: "your_victor_voice_id"
    model_id: "eleven_v3"                    # optional, defaults to global elevenlabs_model_id
    # Opt in to v4 only here: model_id: "eleven_v4". The global base stays multilingual_v2.
    # Optional for v3/v4: replaces model-default delivery tags; [] disables them.
    # Use tag names without brackets. Omit to keep the model defaults.
    # audio_control_tags: ["TikTok narrator"]
    languages: ["fr"]                         # optional, omit = available for all languages
    voice_settings:
      stability: 0.45
      similarity_boost: 0.8
      style: 0.0
      speed: 1.0
      use_speaker_boost: true
    auto_editor_overrides:                    # optional, overrides production auto-editor profile
      threshold: "0.060"
      margin: "0.04sec,0.20sec"
    default_tts_speed: 1.1                    # optional, 0.9-1.5; post-generation speed slider default,
                                              # applied once when Automate finishes generating TTS with
                                              # this voice (omit = 1.0). NOT the ElevenLabs speed param.
