# Account configuration for multi-channel upload scheduling.
# Copy this file to config.yaml and fill in your credentials.
#
# Global credentials (Meta app_id/secret, Google OAuth client, Discord, Drive)
# stay in .env. Only per-account tokens go here.

# --- Optional templates -----------------------------------------------------
#
# Accounts often share a social identity (same YouTube channel, same Facebook
# Page) while differing elsewhere. Define partial account configs here and
# reference them from accounts with `template:` (a name, or a list of names).
#
# Merge rules:
#   - Templates apply left-to-right; the account's own keys always win last.
#   - Nested blocks (youtube:, meta:, ...) merge key-by-key, so an account can
#     override just `youtube.slots` and inherit the rest from the template.
#   - Lists and scalars replace wholesale (same replace-semantics as slots).
#   - Templates cannot reference other templates.
#   - An unknown template name skips that account (logged), others still load.
#
# templates:
#   yt_main:                      # shared YouTube channel
#     youtube:
#       refresh_token: "1//0..."
#       channel_id: "UC..."
#   meta_main:                    # shared Facebook Page + Instagram identity
#     meta:
#       token_mode: "system_user"
#       facebook_page_id: "123..."
#       facebook_page_access_token: "EAA..."
#       instagram_business_account_id: "456..."
#     facebook:
#       max_reel_duration_seconds: 90
#     instagram:
#       max_reel_duration_seconds: 90
#   fr_defaults:                  # shared scheduling defaults
#     language: "fr"
#     supported_types: ["anime"]
#     slots: ["06:00", "12:00", "18:00", "22:00"]
#
# accounts:
#   anime_fr:
#     template: [fr_defaults, yt_main, meta_main]
#     name: "Anime FR"
#     avatar: "anime_fr.jpg"
#     tiktok:                     # TikTok differs per account — keep it inline
#       post_for_me_account_id: "spc_..."

accounts:
  anime_fr:
    name: "Anime FR"
    language: "fr"
    supported_types:
      - "anime"
    avatar: "anime_fr.jpg"       # filename in <repo>/server/avatars/ (served by VPS)
    device: "iphone_13_pro"     # optional: label shown in the Discord embed (legacy manual-post field)
    # Upload slots in UTC (HH:MM). Shared by every platform on this account.
    slots:
      - "14:00"
      - "18:00"
      - "21:00"
    youtube:
      refresh_token: "1//0..."
      channel_id: "UC..."        # optional: enforce upload target + shared-pool key
      category_id: "22"          # optional: defaults to global ATR_YOUTUBE_CATEGORY_ID
    meta:
      token_mode: "system_user"  # "system_user" or "long_lived_user"
      facebook_page_id: "123..."
      facebook_page_access_token: "EAA..."
      instagram_business_account_id: "456..."
      instagram_access_token: "IGA..."  # optional: defaults to facebook_page_access_token
    # Keep these at 90 until the non-public capability probe has verified the
    # exact hard limit for this Page / Instagram identity.
    facebook:
      max_reel_duration_seconds: 90
    instagram:
      max_reel_duration_seconds: 90
    tiktok:
      # Post for Me social-account id (spc_...) — enables automatic TikTok
      # publishing via the VPS server. See docs/POST_FOR_ME_SETUP.md.
      post_for_me_account_id: "spc_..."
      # Connector used when this spc_ id was authorized. Keep the default
      # "tiktok" for consumer connections; use "tiktok_business" only with
      # an id returned by that OAuth flow. The Business API connector supports
      # Personal TikTok accounts and must not be confused with changing the
      # TikTok profile itself to a Business Account.
      post_for_me_platform: "tiktok"
      # Optional post options (defaults shown):
      # privacy_status: "public"
      # allow_comment: true
      # allow_duet: true
      # allow_stitch: true

  # Optional example: per-platform slot overrides.
  #
  # A `youtube:` / `facebook:` / `instagram:` / `tiktok:` block with its own
  # `slots:` REPLACES the top-level slots for that platform only. Omit the
  # block (or omit its `slots:`) to inherit the defaults above.
  #
  # Accounts sharing a social identity pool their reservations so two accounts
  # can't book the same slot:
  #   - YouTube   pooled by `youtube.channel_id`
  #   - Facebook  pooled by `meta.facebook_page_id`
  #   - Instagram pooled by `meta.instagram_business_account_id`
  #   - TikTok    pooled by tiktok.post_for_me_account_id
  #
  # anime_en:
  #   name: "Anime EN"
  #   language: "en"
  #   supported_types:
  #     - "anime"
  #   avatar: "anime_en.png"
  #   device: "pixel_8_pro"       # optional: label shown in the Discord embed (legacy manual-post field)
  #   slots:
  #     - "15:00"
  #     - "20:00"
  #   youtube:
  #     refresh_token: "1//0..."
  #     slots:                   # YouTube-only override
  #       - "16:00"
  #   meta:
  #     token_mode: "system_user"
  #     facebook_page_id: "789..."
  #     facebook_page_access_token: "EAA..."
  #     instagram_business_account_id: "012..."
