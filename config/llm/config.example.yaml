default: gpt

presets:
  gpt:
    label: "GPT (6.1 Sol + 6 Luna)"
    big:
      openrouter_id: openai/gpt-6.1-sol
      max_output_tokens: 4096
      thinking:
        effort: low
    light:
      openrouter_id: openai/gpt-6-luna
      thinking: null

  claude:
    label: "Claude (Sonnet 5.5 + Haiku 5.5)"
    big:
      openrouter_id: anthropic/claude-sonnet-5.5
      thinking: null
    light:
      openrouter_id: anthropic/claude-haiku-5.5
      thinking:
        effort: low

  gemini:
    label: "Gemini (4 Argon + 3.8 Flash)"
    big:
      openrouter_id: google/gemini-4-argon
      thinking:
        effort: high
    light:
      openrouter_id: google/gemini-3.8-flash
      thinking:
        effort: medium

  mistral:
    label: "Mistral (Large 3 2512 + Small 4)"
    big:
      openrouter_id: mistralai/mistral-large-2512
      thinking: null
    light:
      openrouter_id: mistralai/mistral-small-2603
      thinking:
        effort: medium

  grok:
    label: "Grok (4.3)"
    big:
      openrouter_id: x-ai/grok-4.3
      thinking:
        effort: high
    light:
      openrouter_id: x-ai/grok-4.3
      thinking:
        effort: low

translation:
  openrouter_id: google/gemini-2.5-flash-lite
  thinking: null

# Cached visual episode index and V4 selection, independent of the writer.
facecam_illustrations:
  openrouter_id: google/gemini-3.8-flash
  max_output_tokens: 4096
  thinking:
    effort: minimal

# Independent of the script generation preset; bounded local narration repair.
script_repair:
  openrouter_id: google/gemini-3.1-flash-lite
  thinking:
    effort: minimal
