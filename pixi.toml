[workspace]
name = "anime-tiktok-reproducer"
version = "0.1.0"
description = "Web app to remaster TikToks by finding anime source clips and generating Premiere Pro projects"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Request CUDA support for PyTorch
[system-requirements]
cuda = "12"

[dependencies]
# Python
python = ">=3.11,<3.13"

# FFmpeg for video processing
ffmpeg = ">=6.0"

# OpenCV from conda-forge
opencv = ">=4.10"
httpx = ">=0.28.1,<0.29"

[pypi-dependencies]
# PyTorch with CUDA from PyPI (required for whisperx compatibility)
torch = { version = ">=2.8.0,<2.9.0", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = ">=2.8.0,<2.9.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.23.0", index = "https://download.pytorch.org/whl/cu128" }
torchcodec = ">=0.7.0,<0.8.0"

# GPU source decode for the aligner window primitive (GOAL v5.3). Persistent
# in-process NVDEC via NVIDIA's PyNvVideoCodec; nvidia-npp-cu12 provides the
# NPP runtime it links. Both are optional at runtime: a capability probe falls
# back transparently to cv2 per-process when the decoder/driver is unavailable.
pynvvideocodec = "==2.2.2"
nvidia-npp-cu12 = ">=12.4,<13"

# WhisperX — now used ONLY for wav2vec2 forced alignment + audio loading
# (ASR moved to plain faster-whisper via app/services/asr_engine.py, 08-13).
# 3.8+ pulls pyannote-audio>=4 (used solely by raw-scene diarization).
# 3.8 is RC-only as of 2026-08; acceptable: our whisperx surface is align-only.
whisperx = ">=3.8.0rc1"

# FAISS for similarity search (CPU is fast enough for our use case)
faiss-cpu = ">=1.7.4"

# FastAPI + server
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.32.0", extras = ["standard"] }
python-multipart = ">=0.0.18"
pydantic = ">=2.10.0"
pydantic-settings = ">=2.6.0"
aiofiles = ">=24.1.0"
requests = ">=2.32.0"
anthropic = ">=0.40.0"
openai = ">=1.50.0"

# ProPainter temporal video inpainting (Pure-mode subtitle/watermark removal);
# code vendored at modules/propainter, weights downloaded on first use.
einops = ">=0.7"

# Video/Audio processing
av = ">=15.0,<16"
yt-dlp = { url = "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/download/2026.07.23.234303/yt-dlp.tar.gz" }
# Enables yt-dlp's browser impersonation path, which TikTok's extractor uses
# when the regular webpage is protected by its JavaScript challenge.
curl-cffi = ">=0.11,<0.16"
# Held <0.7: scenedetect 0.7 changes the detection API
scenedetect = ">=0.6.5,<0.7"
# 28.x was deleted from PyPI, and the only PyPI release (29.3.1, Nim rewrite)
# has a broken audio renderer: every clip renders at 2x speed padded with
# silence (verified 2026-07-06 on synthetic + real TTS wavs). Install the
# last known-good Python version from the upstream git tag instead.
auto-editor = { git = "https://github.com/WyattBlue/auto-editor", tag = "28.1.0" }
opentimelineio = ">=0.18.1"
pillow = ">=10.0"
scipy = ">=1.10.0"
pydub = ">=0.25.1"

# CLI tools for anime_searcher
typer = ">=0.9"
rich = ">=13.0"

# NLP for determiner detection in SRT generation
spacy = ">=3.7.0"
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }

# Speaker diarization for raw scene detection
# pyannote 4 migration done 2026-08 (raw-scene diarization is the only user)
pyannote-audio = ">=4.0.0"

# YAML config parsing
pyyaml = ">=6.0"
num2words = ">=0.5.14"

# External platform integrations
google-api-python-client = ">=2.173.0"
google-auth = ">=2.40.0"
google-auth-httplib2 = ">=0.2.0"
google-auth-oauthlib = ">=1.2.2"
torf = ">=4.3.1, <5"
asyncssh = ">=2.21.1"

[feature.dev.pypi-dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24.0"
httpx = ">=0.28.0"
respx = ">=0.21.0"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
# Backend tasks
backend = { cmd = "../scripts/backend.sh", cwd = "backend" }

# Frontend tasks (assumes fnm/npm available in PATH)
frontend = { cmd = "npm run dev", cwd = "frontend" }

# Combined dev server
dev = { depends-on = ["backend"] }

# Anime searcher CLI
anime-search = { cmd = "python -m anime_searcher.cli", cwd = "modules/anime_searcher" }
benchmark-anime-index = { cmd = "python -m anime_searcher.benchmark", cwd = "modules/anime_searcher" }

# Bounded hierarchical matcher evaluator (see docs/MATCHER_V2.md)
evaluate-matching-v2 = { cmd = "python scripts/evaluate_matching_v2.py" }

# Testing
test = { cmd = "pytest", cwd = "backend" }
test-verbose = { cmd = "pytest -v", cwd = "backend" }

# Index anime library
index-anime = { cmd = "python -m anime_searcher.cli index", cwd = "modules/anime_searcher" }
